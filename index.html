<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildMind AI Fix Benchmark</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .card {
      width: min(90%, 500px);
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin: 20px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>BuildMind AI Fix Benchmark</h1>

    <p id="status">
      اضغط الزر لاختبار قدرة BuildMind على اكتشاف وإصلاح الخطأ.
    </p>

    <button id="testButton">
      Run Test
    </button>
  </main>

  <script>
    const button = document.getElementById("testButton");
    const status = document.getElementById("status");

    button.addEventListener("click", () => {

      status.textContent = "Running...";

      // ==========================================
      // INTENTIONAL BUG
      // هذه الدالة غير موجودة عمدًا.
      // يجب على BuildMind اكتشاف الخطأ وإصلاحه.
      // ==========================================

      runBenchmarkTest();

    });
  </script>

</body>
</html>
